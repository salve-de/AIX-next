name: Rovan Quality

on:
  push:
    branches: [main, build/clean-room-v2, feature/positioning-autopilot]
  pull_request:
    branches: [main, feature/positioning-autopilot]

permissions:
  contents: read

concurrency:
  group: rovan-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
